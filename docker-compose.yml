services:
  db:
    image: postgres:16
    container_name: dessert_shop_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dessert
      POSTGRES_PASSWORD: dessert
      POSTGRES_DB: dessert_shop
    # Host port 5433 so this does not clash with any other Postgres on 5432.
    ports:
      - "5433:5432"
    volumes:
      - dessert_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dessert -d dessert_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dessert_db_data:
